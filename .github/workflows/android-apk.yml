name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, ccr-4f475dc2-2ptc32]
    paths: ['grokbot/**', 'mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Capacitor project
        working-directory: mobile
        run: |
          npm install
          mkdir -p www && cp -r ../grokbot/. www/
          npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'
          npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dolus-tradebot.apk
          gh release delete grokbot-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create grokbot-apk dolus-tradebot.apk --target "$GITHUB_SHA" \
            --title "Dolus Tradebot (APK)" --notes "APK de debug do Dolus Tradebot (paper trading). Commit ${GITHUB_SHA::7}."
      - uses: actions/upload-artifact@v4
        with: { name: dolus-tradebot-apk, path: dolus-tradebot.apk }
