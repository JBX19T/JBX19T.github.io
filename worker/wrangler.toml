name = "grokbot-holders"
main = "holders.mjs"
compatibility_date = "2025-01-01"

[vars]
# origens autorizadas a chamar o proxy (separadas por vírgula)
ALLOWED_ORIGIN = "https://jbx19t.github.io,https://localhost"

# A chave NÃO vai aqui. Guarda-a como segredo:  npx wrangler secret put HELIUS_API_KEY

# Proteção do servidor e piloto automático: correm a cada 5 minutos, mesmo com a app fechada
[triggers]
crons = ["*/5 * * * *"]

# Memória da proteção (máximo da conta, paragens, entradas das memecoins). Durable Object com SQLite: incluído no plano grátis.
[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Guard"]
