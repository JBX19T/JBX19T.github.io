<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROKBOT + JEV</title>
<style>
:root{--pink:#e04bd0;--bg:#07070d;--card:#0d0d14;--line:#1c1c2a;--txt:#cfd3e6;--dim:#5a5e75;--green:#2fe08a;--red:#ff4b5c;--blue:#2f7bff;--orange:#ffa31a;--hot:#ff3d8b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--pink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--txt);min-height:100vh;padding:12px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;margin-bottom:12px;color:#111}
header h1{font:800 28px/1 system-ui,sans-serif;letter-spacing:-.5px}
header .tag{font-size:11px;letter-spacing:2px;opacity:.55;flex:1}
header .day{font-size:11px;opacity:.6}
.clock{background:#07070d;color:var(--green);padding:7px 12px;border-radius:6px;font-weight:700;font-size:17px}
.logo{width:34px;height:34px;border-radius:8px;background:#111;display:grid;place-items:center}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.card{background:var(--card);border-radius:8px;padding:10px 12px;min-height:84px;border-left:3px solid var(--c);position:relative;transition:box-shadow .2s}
.card.on{box-shadow:0 0 0 1px var(--c),0 0 18px -2px var(--c)}
.card h3{font:800 17px system-ui,sans-serif;color:var(--c);display:flex;align-items:center;gap:8px}
.card h3 i{width:16px;height:16px;border-radius:50%;background:var(--c);display:inline-block}
.card small{display:block;color:var(--dim);font-size:9.5px;margin-top:2px}
.card .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:11px;color:var(--dim)}
.card .val{color:var(--txt);font-weight:700;font-size:13px}
.bar{height:3px;background:var(--line);margin-top:5px;border-radius:2px}
.bar b{display:block;height:100%;background:var(--c);width:0;transition:width .5s;border-radius:2px}
.card .say{font-size:10px;color:var(--c);margin-top:6px;min-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{background:var(--card);border-radius:8px;margin-bottom:10px;overflow:hidden}
.panel .ph{display:flex;justify-content:space-between;padding:8px 12px;font-size:10px;letter-spacing:1px;color:#8d90a8}
.panel .ph em{font-style:normal;color:var(--hot)}
canvas{display:block;width:100%}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:10px}
.th{padding:4px 14px 14px;font-size:11px;line-height:1.85}
.th .sec{color:var(--hot);margin-top:8px}
.th .r{display:grid;grid-template-columns:1fr 70px 70px 18px;padding:0 6px;border-radius:3px}
.th .r span:nth-child(1){color:#8fe3ff}.th .r span:nth-child(3),.th .r span:nth-child(4){text-align:right}
.th .r.fail{background:#3a1420}.th .ok{color:var(--green)}.th .no{color:var(--red)}
.chain{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);font-size:10px;align-items:center;color:var(--dim)}
.chain span.p{border:1px solid var(--line);padding:3px 8px;border-radius:4px}
.chain span.p.on{background:var(--hot);color:#fff;border-color:var(--hot)}
.chain span.p.pass{color:var(--green);border-color:#164a30}
.an{padding:0 12px 12px}
.an .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:10px;color:var(--dim);margin-bottom:6px}
.an .meta b{display:block;color:var(--txt);font-size:12px}
.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px;font-size:10px;margin-top:8px}
.checks div{display:flex;justify-content:space-between}
.log{max-height:150px;overflow:auto;padding:4px 12px 10px;font-size:11px;line-height:1.7}
.log .t{color:var(--dim)}.log .w{color:var(--green)}.log .l{color:var(--red)}.log .p{color:var(--hot)}
.foot{color:#111;font-size:10px;opacity:.7;text-align:center;margin-top:8px}
@media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}header .tag{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff"/><circle cx="9" cy="10" r="1.6" fill="#111"/><circle cx="15" cy="10" r="1.6" fill="#111"/></svg></div>
  <h1>GROKBOT + JEV</h1><div class="tag">JEV PICKS, GROK TRADES</div>
  <div class="day" id="day"></div><div class="clock" id="clock">--:-- UTC</div>
</header>

<div class="cards" id="cards"></div>

<div class="panel"><div class="ph"><span>DESK</span><em id="deskinfo">PAPER TRADING · SIMULATED</em></div><canvas id="office" height="430"></canvas></div>

<div class="panel"><div class="ph"><span id="balLabel">BALANCE · DAY 1 · PAPER</span><em id="balPnl"></em></div><canvas id="bal" height="150"></canvas></div>

<div class="two">
  <div class="panel"><div class="ph"><span>JEV · ANALYSIS</span><em id="scanned">0 SCANNED</em></div>
    <div class="an"><div class="meta" id="meta"></div><canvas id="chart" height="230"></canvas><div class="checks" id="checks"></div></div>
  </div>
  <div class="panel"><div class="ph"><span>thresholds.py</span><em>EVERY NUMBER THE DESK BELIEVES</em></div>
    <div class="th" id="th"></div>
    <div class="chain" id="chain"></div>
  </div>
</div>

<div class="panel"><div class="ph"><span>TRADE LOG</span><em>PAPER</em></div><div class="log" id="log"></div></div>
<div class="foot">Simulação (paper trading) — dados gerados aleatoriamente, sem dinheiro real nem ligação a exchanges.</div>
</div>

<script>
/* ===== CONFIG: tudo o que o "desk" acredita (thresholds.py) ===== */
const CFG = {
  startBalance: 12000,
  ticketPct: [0.10, 0.25],       // % do saldo por posição
  takeProfit: 0.35, stopLoss: -0.14, maxHoldTicks: 22,
  hard: [  // [chave, limite, tipo, métrica]
    ['min_age_minutes', 15,     'min','age',    v=>v+'m'],
    ['min_liquidity_usd',12000, 'min','liq',    fmt],
    ['min_volume_h24',  40000,  'min','vol',    fmt],
    ['min_mcap_usd',    60000,  'min','mcap',   fmt],
    ['min_trades_h24',  150,    'min','trades', v=>v],
    ['max_top_wallet',  0.05,   'max','topWallet',v=>v.toFixed(2)],
    ['max_top_10',      0.60,   'max','top10',  v=>v.toFixed(2)],
  ],
  soft: [  // [chave, limite, tipo]
    ['concentration_is_exit_risk',0.55,'max'],
    ['momentum_already_spent',    0.60,'max'],
    ['liquidity_fits_ticket',     0.40,'min'],
    ['account_is_the_project',    0.70,'min'],
    ['recycled_account',          0.50,'max'],
    ['dev_still_loaded',          0.55,'max'],
  ],
  shapeMin: 0.35
};
const CHAIN = ['free_kill','trade_kill','shape_kill','soft_kill','pick'];
const NAMES = ['HIGGS','PLAGUE','SAPLING','MICDUCK','PAID','ANYO','ICAT','PORKE','SNEEBOT','TIPTOE','PDG','STORM','SEET','BOZO','MOONCAT','DEGEN','FROGE','PEPA','WAGMI','GIGA','CHAD','NORMIE','SLERF','POPCAT'];

/* ===== util ===== */
const $=id=>document.getElementById(id), rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
function fmt(v){return v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':Math.round(v)}
const money=v=>'$'+v.toFixed(2);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ===== agentes ===== */
const AG = {
  chief:{n:'CHIEF',sub:'never takes a position',c:'#e04bd0',shape:'ghost'},
  scan:{n:'SCAN',sub:'finding what moves',c:'#2f7bff',shape:'circle'},
  vet:{n:'VET',sub:'chain risk, is it real',c:'#ffffff',shape:'circle'},
  social:{n:'SOCIAL',sub:"the project's X account",c:'#ff4b5c',shape:'square'},
  size:{n:'SIZE',sub:'how much',c:'#ff3d8b',shape:'tri'},
  fills:{n:'FILLS',sub:'execution',c:'#2fe08a',shape:'blob'},
  risk:{n:'RISK',sub:'closing',c:'#ffa31a',shape:'hex'},
  crawler:{n:'CRAWLER',sub:'reads first, then the desk trades',c:'#e04bd0',shape:'none'}
};
const order=['chief','scan','vet','social','size','fills','risk','crawler'];
order.forEach(k=>{const a=AG[k];a.el=document.createElement('div');a.el.className='card';a.el.style.setProperty('--c',a.c);
  a.el.innerHTML=`<h3><i></i>${a.n}</h3><small>${a.sub}</small><div class="row"><span class="l1">—</span><span class="val v1">—</span></div><div class="bar"><b></b></div><div class="say"></div>`;
  $('cards').appendChild(a.el);
  a.say=t=>{a.el.querySelector('.say').textContent=t};
  a.set=(l,v,p)=>{a.el.querySelector('.l1').textContent=l;a.el.querySelector('.v1').textContent=v;if(p!=null)a.el.querySelector('.bar b').style.width=Math.max(0,Math.min(1,p))*100+'%'};
  a.flash=()=>{order.forEach(o=>AG[o].el.classList.remove('on'));a.el.classList.add('on')};
});

/* ===== estado ===== */
const S={cash:CFG.startBalance,positions:[],hist:[CFG.startBalance],vol:[0],closed:0,wins:0,scanned:0,pages:0,pts:0,
  day:1,t:new Date(Date.UTC(2026,9,4,22,0)),cur:null,stage:-1,passed:[],failIdx:-1,lastPick:'PAPER'};
const equity=()=>S.cash+S.positions.reduce((s,p)=>s+p.size*(p.px/p.entry),0);

/* ===== geração de token ===== */
function genToken(){
  const good=Math.random()<0.6;
  const mcap=good?rnd(70e3,4e6):rnd(15e3,120e3);
  const t={name:pick(NAMES)+(Math.random()<.3?Math.floor(rnd(1,99)):''),
    age:Math.floor(good?rnd(20,600):rnd(2,60)),mcap,liq:mcap*rnd(.08,.3),vol:mcap*rnd(.15,2.2),
    trades:Math.floor(rnd(40,1400)*(good?1.2:.6)),topWallet:rnd(.01,good?.06:.14),top10:rnd(.25,good?.65:.85),
    shape:Math.random()*(good?1:.7)+.05,
    soft:good?{concentration_is_exit_risk:rnd(.1,.5),momentum_already_spent:rnd(.1,.55),liquidity_fits_ticket:rnd(.45,1),
          account_is_the_project:rnd(.72,1),recycled_account:rnd(0,.45),dev_still_loaded:rnd(.1,.5)}
      :{concentration_is_exit_risk:rnd(.3,.9),momentum_already_spent:rnd(.4,1),liquidity_fits_ticket:rnd(.1,.7),
          account_is_the_project:rnd(.2,.8),recycled_account:rnd(.3,1),dev_still_loaded:rnd(.3,1)},
    candles:[]};
  if(good&&Math.random()<.15){const k=pick(Object.keys(t.soft));t.soft[k]=k==='account_is_the_project'||k==='liquidity_fits_ticket'?rnd(.1,.3):rnd(.8,1)}
  let p=1;for(let i=0;i<60;i++){const o=p;p=Math.max(.05,p*(1+rnd(-.09,.095)*(i>45?.5:1)));t.candles.push({o,c:p,h:Math.max(o,p)*(1+rnd(0,.03)),l:Math.min(o,p)*(1-rnd(0,.03)),v:rnd(.2,1)})}
  t.px=p;return t;
}

/* ===== UI: thresholds ===== */
function renderTh(t,failKey){
  let h='<div class="sec">HARD = { <span style="color:var(--dim)"># arithmetic, costs nothing</span></div>';
  CFG.hard.forEach(([k,lim,ty,m,f])=>{
    let v='',mark='…',cls='';
    if(t&&S.stage>=0){const x=t[m];v=f(x);const ok=ty==='min'?x>=lim:x<=lim;mark=ok?'✓':'✗';if(!ok)cls=' fail'}
    h+=`<div class="r${cls}"><span>${k}</span><span>${ty==='max'?lim.toFixed(2):lim.toLocaleString('en').replace(/,/g,'_')}</span><span>${v}</span><span class="${mark==='✓'?'ok':mark==='✗'?'no':''}">${mark}</span></div>`;});
  h+='<div class="sec">SOFT = { <span style="color:var(--dim)"># applied to jev\'s answers</span></div>';
  CFG.soft.forEach(([k,lim,ty])=>{
    let v='',mark='…',cls='';
    if(t&&S.stage>=3){const x=t.soft[k];v=x.toFixed(2);const ok=ty==='min'?x>=lim:x<=lim;mark=ok?'✓':'✗';if(!ok)cls=' fail'}
    h+=`<div class="r${cls}"><span>${k}</span><span>${ty} ${lim.toFixed(2)}</span><span>${v}</span><span class="${mark==='✓'?'ok':mark==='✗'?'no':''}">${mark}</span></div>`;});
  $('th').innerHTML=h;
}
function renderChain(){
  $('chain').innerHTML='<span>filter.py · THE ORDER IS THE WHOLE POINT</span><br>'+CHAIN.map((c,i)=>{
    const cl=S.failIdx===i?'on':S.stage>i&&S.failIdx<0?'pass':S.stage===i&&S.failIdx<0?'on':'';
    return `<span class="p ${cl}">${c}</span>`}).join('<span>→</span>');
}
function renderMeta(t){
  $('meta').innerHTML=`<div><b>${t.name}</b>token</div><div><b>$${fmt(t.mcap)}</b>mcap</div><div><b>$${fmt(t.liq)}</b>liquidity</div><div><b>$${fmt(t.vol)}</b>vol 24h</div><div><b>${t.trades}</b>trades</div><div><b>${t.age}m</b>age</div>`;
  const names=['liquidity depth','holder spread','volume vs mcap','rug signature','fresh wallets','entry window'];
  const vals=[t.liq/t.mcap>.12,t.top10<.65,t.vol/t.mcap>.4,t.soft.dev_still_loaded<.55,t.soft.recycled_account<.5,t.shape>.4];
  $('checks').innerHTML=names.map((n,i)=>`<div><span>${n}</span><b class="${vals[i]?'ok':'no'}" style="color:var(--${vals[i]?'green':'red'})">${vals[i]?'PASS':'FAIL'}</b></div>`).join('');
}

/* ===== gráficos ===== */
function setup(c){const d=devicePixelRatio||1,w=c.clientWidth,h=+c.getAttribute('height');c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);return [x,w,h]}
function drawBal(){
  const [x,w,h]=setup($('bal'));x.clearRect(0,0,w,h);
  const d=S.hist,mn=Math.min(...d)*.995,mx=Math.max(...d)*1.005,pl=50,pr=170,ph=h-30;
  const X=i=>pl+(w-pl-pr)*i/Math.max(1,d.length-1),Y=v=>10+(ph-10)*(1-(v-mn)/(mx-mn||1));
  x.fillStyle='#4a4d62';x.font='9px monospace';for(let i=0;i<3;i++){const v=mn+(mx-mn)*i/2;x.fillText('$'+Math.round(v),6,Y(v)+3)}
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(47,224,138,.25)');g.addColorStop(1,'rgba(47,224,138,0)');
  x.beginPath();d.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.strokeStyle='#2fe08a';x.lineWidth=2;x.stroke();
  x.lineTo(X(d.length-1),ph);x.lineTo(X(0),ph);x.fillStyle=g;x.fill();
  const bw=Math.max(2,(w-pl-pr)/Math.max(d.length,30)-1);S.vol.forEach((v,i)=>{x.fillStyle=v>=0?'rgba(47,224,138,.55)':'rgba(255,75,92,.55)';const bh=Math.min(18,Math.abs(v)*3+2);x.fillRect(X(i)-bw/2,h-bh,bw,bh)});
  const e=equity();x.fillStyle='#2fe08a';x.font='bold 22px system-ui';x.fillText(money(e),w-pr+14,h/2);
  x.fillStyle='#4a4d62';x.font='9px monospace';x.fillText('BALANCE',w-pr+14,h/2-26);
  const pnl=e-CFG.startBalance;$('balPnl').textContent=`${S.wins}W ${S.closed-S.wins}L · ${pnl>=0?'+':''}${(pnl/CFG.startBalance*100).toFixed(2)}%`;
}
function drawChart(){
  const [x,w,h]=setup($('chart'));x.clearRect(0,0,w,h);const t=S.cur;if(!t)return;
  const cs=t.candles,mn=Math.min(...cs.map(c=>c.l)),mx=Math.max(...cs.map(c=>c.h)),cw=w/cs.length;
  const Y=v=>8+(h-40)*(1-(v-mn)/(mx-mn||1));
  cs.forEach((c,i)=>{const up=c.c>=c.o,col=up?'#2fe08a':'#ff5a3c',cx=i*cw+cw/2;x.strokeStyle=col;x.fillStyle=col;
    x.beginPath();x.moveTo(cx,Y(c.h));x.lineTo(cx,Y(c.l));x.stroke();
    x.fillRect(cx-cw*.32,Math.min(Y(c.o),Y(c.c)),cw*.64,Math.max(1,Math.abs(Y(c.o)-Y(c.c))));
    x.globalAlpha=.4;x.fillRect(cx-cw*.32,h-4-c.v*26,cw*.64,c.v*26);x.globalAlpha=1});
  if(S.pos){x.setLineDash([4,4]);x.strokeStyle='#ff3d8b';x.beginPath();x.moveTo(0,Y(S.pos));x.lineTo(w,Y(S.pos));x.stroke();x.setLineDash([])}
}

/* ===== escritório (canvas) ===== */
const desks={chief:[.12,.28],scan:[.30,.62],vet:[.50,.62],social:[.70,.62],size:[.22,.82],fills:[.78,.34],risk:[.40,.84],crawler:[.55,.22]};
const bots={};order.forEach(k=>{if(AG[k].shape==='none')return;const d=desks[k];bots[k]={x:d[0],y:d[1],tx:d[0],ty:d[1],bub:'',bt:0}});
let link=null;
function say(k,txt,target){if(bots[k]){bots[k].bub=txt;bots[k].bt=performance.now()+2600}AG[k].say(txt);AG[k].flash();link={from:k,to:target||'chief',t:performance.now()}}
function drawOffice(ts){
  const c=$('office'),[x,w,h]=setup(c);x.fillStyle='#0a0a12';x.fillRect(0,0,w,h);
  x.strokeStyle='#14141f';x.lineWidth=1;for(let i=0;i<w;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke()}for(let j=0;j<h;j+=32){x.beginPath();x.moveTo(0,j);x.lineTo(w,j);x.stroke()}
  // logo + monitor
  x.fillStyle='#fff';x.font='800 20px system-ui';x.fillText('FOMO',w*.04,h*.2);
  x.fillStyle='#10101a';x.strokeStyle='#2a2a40';x.fillRect(w*.22,h*.07,w*.44,h*.28);x.strokeRect(w*.22,h*.07,w*.44,h*.28);
  if(S.cur){const cs=S.cur.candles,mn=Math.min(...cs.map(a=>a.l)),mx=Math.max(...cs.map(a=>a.h)),bw=w*.44/cs.length;
    cs.forEach((a,i)=>{const Y=v=>h*.09+h*.24*(1-(v-mn)/(mx-mn||1));x.fillStyle=a.c>=a.o?'#2fe08a':'#ff5a3c';x.fillRect(w*.22+i*bw+1,Math.min(Y(a.o),Y(a.c)),bw-2,Math.max(1,Math.abs(Y(a.o)-Y(a.c))))})}
  x.fillStyle='#2fe08a';x.font='9px monospace';x.fillText(`${S.scanned} SCANNED · ${S.positions.length} OPEN · TICKET ${S.closed}`,w*.23,h*.065);
  // token avatars
  ['#fff','#e8212e','#d6b23a','#1a8ba8','#b88c5a','#e8212e'].forEach((col,i)=>{x.beginPath();x.arc(w*.7+i*34,h*.1,14,0,7);x.fillStyle=col;x.fill();x.strokeStyle='#fff';x.stroke()});
  // desks
  order.forEach(k=>{const d=desks[k];if(AG[k].shape==='none')return;const dx=d[0]*w,dy=d[1]*h;x.fillStyle='#14141f';x.strokeStyle='#26263a';x.fillRect(dx-34,dy+10,68,26);x.strokeRect(dx-34,dy+10,68,26);
    x.fillStyle=AG[k].c;x.globalAlpha=.5;x.fillRect(dx-22,dy+15,44,3);x.globalAlpha=1;x.fillStyle='#4a4d62';x.font='8px monospace';x.fillText(AG[k].n,dx-14,dy+48)});
  // rocket + radar
  x.fillStyle='#ddd';x.beginPath();x.moveTo(w*.84,h*.5);x.lineTo(w*.86,h*.62);x.lineTo(w*.82,h*.62);x.fill();x.fillStyle='#4a4d62';x.font='8px monospace';x.fillText('TOP SCANNER',w*.80,h*.66);
  const ra=ts/600%6.28;x.strokeStyle='#2fe08a';x.beginPath();x.arc(w*.85,h*.82,18,0,7);x.stroke();x.beginPath();x.moveTo(w*.85,h*.82);x.lineTo(w*.85+Math.cos(ra)*18,h*.82+Math.sin(ra)*18);x.stroke();x.fillText('WHALE RADAR',w*.81,h*.93);
  // link graph
  if(link&&bots[link.from]){const age=(ts-link.t)/1800;if(age<1){const a=bots[link.from],b=bots[link.to]||bots.chief;x.globalAlpha=1-age;x.strokeStyle=AG[link.from].c;x.lineWidth=1.5;
    for(let i=0;i<7;i++){const ang=i/7*6.28+ts/400;x.beginPath();x.moveTo(a.x*w,a.y*h);x.lineTo(a.x*w+Math.cos(ang)*50*age+20,a.y*h+Math.sin(ang)*40*age-30);x.stroke()}
    x.beginPath();x.moveTo(a.x*w,a.y*h);x.lineTo(b.x*w,b.y*h);x.setLineDash([5,4]);x.stroke();x.setLineDash([]);x.globalAlpha=1;x.lineWidth=1}}
  // bots
  for(const k in bots){const b=bots[k];b.x+=(b.tx-b.x)*.05;b.y+=(b.ty-b.y)*.05;const px=b.x*w,py=b.y*h+Math.sin(ts/300+px)*2,col=AG[k].c,r=13;
    x.fillStyle=col;x.beginPath();
    if(AG[k].shape==='tri'){x.moveTo(px,py-r);x.lineTo(px+r,py+r*.8);x.lineTo(px-r,py+r*.8);x.fill()}
    else if(AG[k].shape==='square'){x.roundRect(px-r,py-r,r*2,r*2,5);x.fill()}
    else if(AG[k].shape==='hex'){for(let i=0;i<6;i++)x.lineTo(px+Math.cos(i*1.047)*r,py+Math.sin(i*1.047)*r);x.fill()}
    else if(AG[k].shape==='blob'){x.ellipse(px,py,r*1.2,r*.8,0,0,7);x.fill()}
    else{x.arc(px,py,r,0,7);x.fill()}
    x.fillStyle='#111';x.beginPath();x.arc(px-4,py-2,1.8,0,7);x.arc(px+4,py-2,1.8,0,7);x.fill();
    if(ts<b.bt&&b.bub){x.font='9px monospace';const tw=x.measureText(b.bub).width+12,bx=Math.min(w-tw-4,Math.max(4,px-tw/2));x.fillStyle='#0d1a26';x.strokeStyle=col;x.fillRect(bx,py-r-26,tw,16);x.strokeRect(bx,py-r-26,tw,16);x.fillStyle='#bfefff';x.fillText(b.bub,bx+6,py-r-14)}}
  requestAnimationFrame(drawOffice);
}

/* ===== log ===== */
function log(cls,txt){const d=document.createElement('div');d.innerHTML=`<span class="t">${S.t.toISOString().slice(11,16)}</span> <span class="${cls}">${txt}</span>`;const L=$('log');L.prepend(d);while(L.children.length>60)L.lastChild.remove()}

/* ===== lógica do desk ===== */
function move(k,spot){const d=desks[spot||k];bots[k].tx=d[0]+rnd(-.03,.03);bots[k].ty=d[1]+rnd(-.04,-.01)}
function tickPositions(){
  for(const p of S.positions.slice()){
    p.px*=1+rnd(-.07,.085)+(p.t.shape-.5)*.015;p.age++;const r=p.px/p.entry-1;
    let why=r>=CFG.takeProfit?'take-profit':r<=CFG.stopLoss?'stop-loss':p.age>=CFG.maxHoldTicks?'time-stop':null;
    if(why){S.positions.splice(S.positions.indexOf(p),1);const pnl=p.size*r;S.cash+=p.size+pnl;S.closed++;if(pnl>0)S.wins++;S.vol.push(pnl);
      say('risk',`${why} ${p.t.name} ${r>=0?'+':''}${(r*100).toFixed(1)}%`);log(pnl>0?'w':'l',`CLOSE ${p.t.name} ${why} ${pnl>=0?'+':''}${money(pnl)}`);
      AG.risk.set('closed',`${S.wins}W ${S.closed-S.wins}L`,S.closed?S.wins/S.closed:0)}
  }
  if(S.pos&&S.cur&&S.positions.length)S.pos=S.positions.find(p=>p.t===S.cur)?.t.px;
}
function advClock(){S.t=new Date(S.t.getTime()+rnd(14,24)*60000);$('clock').textContent=S.t.toISOString().slice(11,16)+' UTC';
  $('day').textContent=`DAY ${S.day} · ${S.t.toUTCString().slice(8,11).toUpperCase()} ${S.t.getUTCDate()}`;$('balLabel').textContent=`BALANCE · DAY ${S.day} · ${S.lastPick}`}

async function cycle(){
  const t=genToken();S.cur=t;S.pos=null;S.stage=-1;S.failIdx=-1;S.scanned++;$('scanned').textContent=S.scanned+' SCANNED';
  renderMeta(t);renderTh(t);renderChain();drawChart();advClock();tickPositions();
  // CRAWLER
  S.pages+=Math.floor(rnd(2,9));S.pts+=Math.floor(rnd(0,5));AG.crawler.set('pages / pts read',`${S.pages} / ${S.pts}`,Math.min(1,(S.scanned%10)/10));say('crawler','reading '+t.name+'…','scan');await sleep(900);
  // SCAN
  move('scan','scan');say('scan',`scanning ${t.name} · shape ${t.shape.toFixed(2)}`);AG.scan.set('shape_score',t.shape.toFixed(2),t.shape);await sleep(1100);
  // free_kill (hard)
  S.stage=0;renderTh(t);renderChain();
  const hardFail=CFG.hard.find(([k,l,ty,m])=>ty==='min'?t[m]<l:t[m]>l);
  if(hardFail){S.failIdx=0;renderChain();say('vet',`free_kill: ${hardFail[0]}`);log('l',`✗ ${t.name} killed by ${hardFail[0]}`);AG.vet.set('last kill',hardFail[0].replace('min_','').replace('max_',''),.2);
    move('scan');return finish()}
  // trade_kill — VET (chain risk)
  await sleep(700);S.stage=1;renderChain();move('vet','vet');say('vet',`chain check ${t.name}`);AG.vet.set('dev_still_loaded',t.soft.dev_still_loaded.toFixed(2),t.soft.dev_still_loaded);await sleep(1000);
  // shape_kill
  S.stage=2;renderChain();
  if(t.shape<CFG.shapeMin){S.failIdx=2;renderChain();say('scan','shape_kill: flat curve');log('l',`✗ ${t.name} shape_kill ${t.shape.toFixed(2)}`);return finish()}
  // soft_kill — SOCIAL
  move('social','social');say('social',`@${t.name.toLowerCase()} recycled ${t.soft.recycled_account.toFixed(2)}`);AG.social.set('recycled_account',t.soft.recycled_account.toFixed(2),t.soft.recycled_account);await sleep(1000);
  S.stage=3;renderTh(t);renderChain();await sleep(900);
  const softFail=CFG.soft.find(([k,l,ty])=>ty==='min'?t.soft[k]<l:t.soft[k]>l);
  if(softFail){S.failIdx=3;renderChain();say('chief',`soft_kill: ${softFail[0]}`);log('l',`✗ ${t.name} soft_kill ${softFail[0]}`);return finish()}
  // pick — CHIEF → SIZE → FILLS
  S.stage=4;renderChain();S.lastPick=t.name;
  say('chief',`pick ${t.name}`,'size');AG.chief.set('last pick',t.name,1);log('p',`PICK ${t.name}`);await sleep(900);
  const pct=rnd(...CFG.ticketPct),eq=equity(),size=Math.min(S.cash*.95,eq*pct);
  if(size<50||S.positions.length>=5){say('size','no room — passing');log('l',`✗ ${t.name} no capital`);return finish()}
  move('size','size');say('size',`ticket ${(pct*100).toFixed(1)}% = ${money(size)}`);AG.size.set('ticket',money(size),pct/CFG.ticketPct[1]);await sleep(900);
  move('fills','fills');const slip=rnd(.002,.02);say('fills',`bought ${t.name} · slip ${(slip*100).toFixed(2)}%`);
  S.cash-=size;S.positions.push({t,size,entry:t.px*(1+slip),px:t.px,age:0});S.pos=t.px;AG.fills.set('open',S.positions.length+' pos',S.positions.length/5);
  log('p',`BUY ${t.name} ${money(size)} @ ${t.px.toFixed(3)}`);await sleep(900);
  finish();
}
function finish(){
  S.stage=Math.max(S.stage,0);
  S.hist.push(equity());if(S.hist.length>70){S.hist.shift();S.vol.shift()}while(S.vol.length<S.hist.length)S.vol.push(0);
  if(S.scanned%40===0)S.day++;
  const open=S.positions.length;AG.risk.set('open',open+' pos · '+money(S.positions.reduce((s,p)=>s+p.size,0)),open/5);
  for(const k in bots)move(k);drawBal();drawChart();
}
async function loop(){for(;;){await cycle();await sleep(500)}}

/* ===== init ===== */
CFG.hard.forEach(()=>{});
renderTh(null);renderChain();drawBal();
addEventListener('resize',()=>{drawBal();drawChart()});
requestAnimationFrame(drawOffice);
loop();
</script>
